name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: pyright
        run: uv run pyright src/

  test:
    # 3.13 is the floor `requires-python` promises. 3.14 is what the work is
    # actually done on, and it was untested here until now.
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync

      - name: pytest (unit tests)
        run: uv run pytest tests/ -q --tb=short --ignore=tests/parity/test_e2e_camoufox.py
