version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Update uv.lock and leave a requirement in pyproject.toml alone while it
    # still allows the new release. The default raised every floor to the
    # newest version, which narrows what an install can resolve and broke the
    # tests that hold the websockets floor at 16.0.
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
