[project]
name = "browser-tools"
version = "0.1.0"
description = "Browser automation, debugging, and anti-detect browsing CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = [
    "browser-automation",
    "chrome-devtools",
    "cdp",
    "anti-detect",
    "camoufox",
    "playwright",
    "web-scraping",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "camoufox[geoip]>=0.4.11",
    "pillow>=10.0.0",
    "websockets>=14.0",
    # Security overrides for transitive dependencies.
    # camoufox pulls in aiohttp 3.13.x which has 11 known CVEs (PYSEC-2026-237, etc.).
    # Force >=3.14.1 until camoufox updates its own pin.
    "aiohttp>=3.14.1",
]

[project.urls]
Homepage = "https://github.com/dungle-scrubs/browser-tools"
Repository = "https://github.com/dungle-scrubs/browser-tools"
Issues = "https://github.com/dungle-scrubs/browser-tools/issues"
Changelog = "https://github.com/dungle-scrubs/browser-tools/blob/main/CHANGELOG.md"

[project.scripts]
browser-tools = "browser_tools.cli:main"
bt = "browser_tools.cli:main"
browser-tools-profiler = "browser_tools.profiler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_tools"]
artifacts = [
    "src/browser_tools/*.js",
    "src/browser_tools/*.mjs",
    "src/browser_tools/*.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/browser_tools",
    "tests",
    "README.md",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "parity: live-browser parity-gate capture; skips when no browser is available",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[tool.ruff]
line-length = 100
target-version = "py313"
# src/browser_tools/core/ is chrome-agent vendored verbatim (RFC-01, "Vendoring
# rules"): only an import rewrite is permitted inside it, so it is excluded from
# lint rather than reformatted to this project's rules. force-exclude keeps the
# exclusion in effect even when the path is passed explicitly on the CLI.
extend-exclude = ["src/browser_tools/core"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",    # pycodestyle + pyflakes + isort
    "B",                     # flake8-bugbear
    "C4",                    # flake8-comprehensions
    "RUF",                   # ruff-specific rules
    "SIM",                   # flake8-simplify
    "TCH",                   # flake8-type-checking
    "UP",                    # pyupgrade
]
ignore = ["E501", "E731", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["browser_tools"]
