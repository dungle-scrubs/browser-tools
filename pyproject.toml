[project]
name = "browser-tools"
version = "0.2.0"
description = "Browser automation, debugging, and anti-detect browsing CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = [
    "browser-automation",
    "chrome-devtools",
    "cdp",
    "anti-detect",
    "camoufox",
    "playwright",
    "web-scraping",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# Default install is CLI-first and Node-free: the native engine backs
# snapshot/click/fill (RFC-01 Phase 2 flip, #41), so the base package needs
# only the vendored core's websockets transport. Everything heavier lives
# behind an extra below (RFC-01 "Packaging", Question 4). The websockets floor
# is >=16.0 -- the higher of the two merged projects' floors, required by the
# vendored core.
dependencies = [
    "websockets>=16.0",
]

[project.optional-dependencies]
# The Camoufox anti-detect engine (launch --engine camoufox) and its geoip
# fingerprint data. camoufox pulls in aiohttp 3.13.x, which has known CVEs
# (PYSEC-2026-237, etc.), so the >=3.14.1 override travels with this extra --
# it is moot when Camoufox is not installed, so it does not belong in the
# default set.
camoufox = [
    "camoufox[geoip]>=0.4.11",
    "aiohttp>=3.14.1",
]
# pillow sharpens screenshot blank-frame detection; without it that check falls
# back to a byte-ratio heuristic (screenshot_utils), so it is optional rather
# than required. Grouped under `profiling` per RFC-01 Question 4.
profiling = [
    "pillow>=10.0.0",
]
# Everything at once.
all = [
    "browser-tools[camoufox,profiling]",
]

[project.urls]
Homepage = "https://github.com/dungle-scrubs/browser-tools"
Repository = "https://github.com/dungle-scrubs/browser-tools"
Issues = "https://github.com/dungle-scrubs/browser-tools/issues"
Changelog = "https://github.com/dungle-scrubs/browser-tools/blob/main/CHANGELOG.md"

[project.scripts]
browser-tools = "browser_tools.cli:main"
bt = "browser_tools.cli:main"
browser-tools-profiler = "browser_tools.profiler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_tools"]
artifacts = [
    "src/browser_tools/*.js",
    "src/browser_tools/*.mjs",
    "src/browser_tools/*.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/browser_tools",
    "tests",
    "README.md",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
    # camoufox is a runtime extra, not a default dependency; it is in the dev
    # group so pyright can resolve `camoufox.sync_api` when type-checking the
    # optional Camoufox engine paths.
    "camoufox[geoip]>=0.4.11",
]

[tool.pytest.ini_options]
markers = [
    "parity: live-browser parity-gate capture; skips when no browser is available",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
# src/browser_tools/core/ is chrome-agent vendored verbatim (RFC-01, "Vendoring
# rules"): only import rewrites are permitted inside it, so it is excluded from
# type checking rather than annotated to this project's strict rules.
exclude = ["src/browser_tools/core"]

[tool.ruff]
line-length = 100
target-version = "py313"
# src/browser_tools/core/ is chrome-agent vendored verbatim (RFC-01, "Vendoring
# rules"): only an import rewrite is permitted inside it, so it is excluded from
# lint rather than reformatted to this project's rules. force-exclude keeps the
# exclusion in effect even when the path is passed explicitly on the CLI.
extend-exclude = ["src/browser_tools/core"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",    # pycodestyle + pyflakes + isort
    "B",                     # flake8-bugbear
    "C4",                    # flake8-comprehensions
    "RUF",                   # ruff-specific rules
    "SIM",                   # flake8-simplify
    "TCH",                   # flake8-type-checking
    "UP",                    # pyupgrade
]
ignore = ["E501", "E731", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["browser_tools"]
